# Generated by Zaysa — do not edit manually.
# Commit this file to .github/workflows/zaysa-terraform.yml in your repository.
#
# Pipeline: Validate → (per environment) Plan → Approval Gate → Apply → Build → Notify
# Each deploy pushes a new image tag to this registry; old tags are not deleted. Set a retention rule in your registry.
# Promotion order: prod (auto)
# Safety:   Each environment uses its own Terraform workspace (isolated state)
#           and a plan artifact pinned per env + run id, so what is reviewed is
#           exactly what is applied. A later environment only applies after the
#           earlier one succeeds. Gated environments require a GitHub Environment
#           reviewer approval (terraform-<env>).

name: Zaysa Terraform CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/**', '**/Jenkinsfile*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy — pick one, or "all" to promote through every environment in order'
        type: choice
        required: true
        default: all
        options:
          - all
          - prod
      action:
        description: 'apply = provision/update · plan = plan only, apply nothing (Pull Request strategy) · destroy = tear down the selected environment (gated)'
        type: choice
        required: true
        default: apply
        options:
          - apply
          - plan
          - destroy

# Never interrupt a running Apply — state corruption risk.
concurrency:
  # github.workflow is the workflow's NAME, which every generated Terraform pipeline shares —
  # so N pipelines on one branch all landed in ONE concurrency group and evicted each other.
  # (Seen live: a single commit left five unrelated pipelines showing "Cancelled" that nobody
  # ran and nobody stopped.) workflow_ref is the FILE path + ref, which is unique per pipeline.
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write       # Required for OIDC cloud authentication
  pull-requests: write  # Required to post plan summaries as PR comments

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Validate — fmt + validate + tflint (fast feedback, no credentials)
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Format Check
        # Fails the job if any .tf file is not formatted
        run: terraform -chdir=./infra fmt --check -recursive

      - name: Terraform Init (no backend)
        run: terraform -chdir=./infra init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=./infra validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint
        # Advisory — linting issues are warnings, not hard blockers
        continue-on-error: true
        run: |
          tflint --init
          tflint --chdir=./infra

  # ── Plan (prod) — workspace "prod", pinned artifact tfplan-prod ──
  plan_prod:
    name: Plan (prod)
    needs: validate
    # Only plan this env when it is the selected target (or "all"/push), and not on destroy.
    if: ((github.event.inputs.environment || 'all') == 'all' || (github.event.inputs.environment || 'all') == 'prod') && (github.event.inputs.action || 'apply') != 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Inject Terraform backend stub
        # Zaysa owns the remote-state choice in the pipeline wizard, but many user
        # Terraform repos do not commit a backend block. Without a backend "<type>" {}
        # stub, Terraform ignores -backend-config and silently falls back to local state.
        # The filename must NOT start with a dot — Terraform skips files beginning with
        # "." (treated as hidden/temp), so a dot-prefixed stub would never be loaded and
        # the backend block would be silently ignored.
        run: |
          cat > ./infra/zaysa_backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF

      - name: Provision container registry (Zaysa)
        # 1-click: auto-create the cloud-native registry so build+deploy have a target
        # without hand-written Terraform. Exposes output zaysa_image_repository_url.
        run: |
          cat > ./infra/zaysa_registry.tf <<'EOF'
          resource "aws_ecr_repository" "zaysa_app" {
            name                 = "zqa-cicd-public"
            image_tag_mutability = "MUTABLE"
            force_delete         = true
            image_scanning_configuration {
              scan_on_push = true
            }
          }
          output "zaysa_image_repository_url" {
            value = aws_ecr_repository.zaysa_app.repository_url
          }
          EOF

      - name: Terraform Init
        run: |
          terraform -chdir=./infra init \
            -backend-config="bucket=zqa-w111-tfstate-549243454374" \
            -backend-config="key=zqa-q4-studio/prod/terraform.tfstate" \
            -backend-config="region=us-west-2" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Select Terraform workspace (prod)
        run: |
          terraform -chdir=./infra workspace select -or-create prod

      - name: Terraform Plan
        id: plan
        # exit 0 = no changes, exit 2 = changes present, exit 1 = error
        run: |
          terraform -chdir=./infra plan \
            -out=tfplan.binary \
            -detailed-exitcode \
            -no-color 2>&1 | tee /tmp/plan.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Export plan as JSON (PR decoration)
        if: github.event_name == 'pull_request' && steps.plan.outputs.exit_code != '1'
        run: terraform -chdir=./infra show -json tfplan.binary > ./infra/tfplan.json

      - name: Set up OPA (policy evaluation)
        if: github.event_name == 'pull_request' && steps.plan.outputs.exit_code != '1'
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Evaluate OPA policies against the plan
        if: github.event_name == 'pull_request' && steps.plan.outputs.exit_code != '1'
        run: |
          mkdir -p /tmp/zaysa-policies
          printf '%s' 'WyJuby1wdWJsaWMtczMiLCJlYzItZXhwbGljaXQtaW5zdGFuY2UtdHlwZSIsIm5vLXB1YmxpYy1zc2giXQ==' | base64 -d > /tmp/zaysa-policies/names.json
          printf '%s' 'WyJoYXJkIiwiaGFyZCIsImhhcmQiXQ==' | base64 -d > /tmp/zaysa-policies/enforcement.json
          printf '%s' '' | base64 -d > /tmp/zaysa-policies/p0.rego
          printf '%s' 'cGFja2FnZSB6YXlzYS50ZXJyYWZvcm0KCmRlbnlbbXNnXSB7CiAgciA6PSBpbnB1dC5yZXNvdXJjZV9jaGFuZ2VzW19dCiAgci50eXBlID09ICJhd3NfaW5zdGFuY2UiCiAgbm90IHIuY2hhbmdlLmFmdGVyLmluc3RhbmNlX3R5cGUKICBtc2cgOj0gc3ByaW50ZigiRUMyIGluc3RhbmNlICcldicgbXVzdCBoYXZlIGFuIGV4cGxpY2l0IGluc3RhbmNlX3R5cGUiLCBbci5hZGRyZXNzXSkKfQo=' | base64 -d > /tmp/zaysa-policies/p1.rego
          printf '%s' '' | base64 -d > /tmp/zaysa-policies/p2.rego
          echo '[]' > /tmp/policy-eval.json
          results='[]'
          i=0
          while [ -f /tmp/zaysa-policies/p$i.rego ]; do
            name=$(jq -r ".[$i]" /tmp/zaysa-policies/names.json)
            enf=$(jq -r ".[$i]" /tmp/zaysa-policies/enforcement.json)
            if out=$(opa eval --v0-compatible --data /tmp/zaysa-policies/p$i.rego --input ./infra/tfplan.json --format json 'data.zaysa.terraform' 2>/tmp/opa-err.txt); then
              deny=$(printf '%s' "$out" | jq -c '[(.result[0].expressions[0].value.deny // [])[], (.result[0].expressions[0].value.violations // [])[]]' 2>/dev/null || echo '[]')
              warn=$(printf '%s' "$out" | jq -c '.result[0].expressions[0].value.warn // []' 2>/dev/null || echo '[]')
              results=$(printf '%s' "$results" | jq -c --arg n "$name" --arg e "$enf" --argjson d "$deny" --argjson w "$warn" '. + [{name:$n, enforcement:$e, deny:$d, warn:$w, error:false}]')
            else
              msg=$(head -c 200 /tmp/opa-err.txt | tr '\n\r' '  ')
              results=$(printf '%s' "$results" | jq -c --arg n "$name" --arg e "$enf" --arg m "$msg" '. + [{name:$n, enforcement:$e, deny:[("could not be evaluated: " + $m)], warn:[], error:true}]')
            fi
            i=$((i+1))
          done
          printf '%s' "$results" > /tmp/policy-eval.json
          hard=$(jq '[.[] | select((.enforcement // "hard") != "soft") | .deny[]] | length' /tmp/policy-eval.json)
          soft=$(jq '[.[] | select((.enforcement // "hard") == "soft") | .deny[]] | length' /tmp/policy-eval.json)
          if [ "${soft:-0}" -gt 0 ]; then echo "::warning::OPA advisory (soft) policy findings: $soft — see the PR comment"; fi
          if [ "${hard:-0}" -gt 0 ]; then echo "::error::OPA hard-policy violations: $hard — see the PR comment"; touch /tmp/opa-hard-violation; fi

      - name: Decorate PR — plan, outputs & policy
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- zaysa-tf-plan-prod -->';
            const exitCode = '${{ steps.plan.outputs.exit_code }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const detail = 'https://dev.zaysa.io/dashboard/delivery';
            // A markdown table cell: stringify, neutralize pipes (escaped so they render literally)
            // and newlines (which would break the row), and cap length so one giant output value
            // can't blow past GitHub's 65536-char comment limit.
            function cell(v) {
              var s = (v === null || v === undefined) ? '-' : (typeof v === 'string' ? v : JSON.stringify(v));
              s = String(s).split('|').join('\\|').split('\n').join(' ').split('\r').join('');
              return s.length > 300 ? s.slice(0, 300) + '…(truncated)' : s;
            }
            // A policy/deny message: OPA denies may be objects, not strings — pull out msg/message
            // or JSON.stringify so we never render '[object Object]'; neutralize pipes/newlines.
            function pmsg(m) {
              var t = (m && typeof m === 'object') ? (m.msg || m.message || JSON.stringify(m)) : String(m);
              return String(t).split('|').join('/').split('\n').join(' ').split('\r').join('');
            }
            const lines = [MARKER];
            let planJson = null;
            try { planJson = JSON.parse(fs.readFileSync('./infra/tfplan.json', 'utf8')); } catch (e) { planJson = null; }
            if (!planJson) {
              let tail = '';
              try { tail = fs.readFileSync('/tmp/plan.txt', 'utf8').slice(-50000); } catch (e) {}
              lines.push('## ❌ Terraform plan failed — prod');
              lines.push('');
              lines.push('<details><summary>Show plan output</summary>');
              lines.push('');
              lines.push('```');
              lines.push(tail);
              lines.push('```');
              lines.push('</details>');
            } else {
              const rc = (planJson.resource_changes || []).filter(function (r) { return r && r.change; });
              let added = 0, changed = 0, deleted = 0, unchanged = 0;
              const rows = [];
              for (const r of rc) {
                const a = r.change.actions || [];
                let label;
                if (a.indexOf('create') >= 0 && a.indexOf('delete') >= 0) { label = 'replaced'; changed++; }
                else if (a.indexOf('create') >= 0) { label = 'added'; added++; }
                else if (a.indexOf('delete') >= 0) { label = 'deleted'; deleted++; }
                else if (a.indexOf('update') >= 0) { label = 'changed'; changed++; }
                else { label = 'unchanged'; unchanged++; }
                let name = r.name || '';
                if (r.index !== undefined && r.index !== null) { name += (typeof r.index === 'number') ? ('[' + r.index + ']') : ('["' + r.index + '"]'); }
                rows.push('| ' + label + ' | ' + cell(r.provider_name || '') + ' | ' + cell(r.type) + ' | ' + cell(name) + ' |');
              }
              const status = exitCode === '0' ? '✅ No changes' : '✅ Terraform plan complete!';
              lines.push('## ' + status + ' — prod');
              lines.push('');
              lines.push('### Planned Changes');
              lines.push('**' + added + ' Added · ' + changed + ' Changed · ' + deleted + ' Deleted · ' + unchanged + ' Unchanged**');
              const MAX = 80;
              if (rows.length) {
                lines.push('');
                lines.push('| Change | Provider | Type | Name |');
                lines.push('|---|---|---|---|');
                for (const row of rows.slice(0, MAX)) lines.push(row);
                if (rows.length > MAX) { lines.push(''); lines.push('_…and ' + (rows.length - MAX) + ' more resources (full plan in the run logs)._'); }
              }
              const oc = planJson.output_changes || {};
              const okeys = Object.keys(oc);
              if (okeys.length) {
                let oA = 0, oC = 0, oD = 0, oU = 0;
                const orows = [];
                for (const k of okeys) {
                  const c = oc[k] || {};
                  const a = c.actions || [];
                  if (a.indexOf('create') >= 0) oA++; else if (a.indexOf('update') >= 0) oC++; else if (a.indexOf('delete') >= 0) oD++; else oU++;
                  const before = (c.before === null || c.before === undefined) ? '-' : c.before;
                  let after;
                  if (c.after_unknown === true || (c.after === undefined && a.indexOf('no-op') < 0)) after = '(known after apply)';
                  else after = (c.after === null || c.after === undefined) ? '-' : c.after;
                  orows.push('| ' + cell(k) + ' | ' + cell(before) + ' | ' + cell(after) + ' |');
                }
                lines.push('');
                lines.push('### Outputs');
                lines.push('**' + oA + ' Added ~ ' + oC + ' Changed ~ ' + oD + ' Deleted ~ ' + oU + ' Unchanged**');
                lines.push('');
                lines.push('| Name | Old Value | New Value |');
                lines.push('|---|---|---|');
                for (const r of orows.slice(0, MAX)) lines.push(r);
                if (orows.length > MAX) { lines.push(''); lines.push('_…and ' + (orows.length - MAX) + ' more outputs (full plan in the run logs)._'); }
              }
            }
            let pol = [];
            try { pol = JSON.parse(fs.readFileSync('/tmp/policy-eval.json', 'utf8')); } catch (e) { pol = []; }
            if (pol.length) {
              let denyTotal = 0, warnTotal = 0;
              for (const p of pol) { denyTotal += (p.deny || []).length; warnTotal += (p.warn || []).length; }
              lines.push('');
              lines.push('### Policy Evaluation');
              if (!denyTotal && !warnTotal) {
                lines.push('✅ All ' + pol.length + ' polic' + (pol.length === 1 ? 'y' : 'ies') + ' passed.');
              } else {
                if (denyTotal) lines.push('❌ ' + denyTotal + ' violation' + (denyTotal === 1 ? '' : 's') + (warnTotal ? ' · ' + warnTotal + ' advisory' : '') + ' across ' + pol.length + ' policies:');
                else lines.push('⚠️ ' + warnTotal + ' advisory finding' + (warnTotal === 1 ? '' : 's') + ' across ' + pol.length + ' policies:');
                lines.push('');
                lines.push('| Policy | Result |');
                lines.push('|---|---|');
                for (const p of pol) {
                  const pn = pmsg(p.name);
                  const ds = p.deny || [], ws = p.warn || [];
                  if (!ds.length && !ws.length) { lines.push('| ' + pn + ' | ✅ Passed |'); continue; }
                  for (const m of ds) lines.push('| ' + pn + ' | ' + (p.error ? '⚠️ ' : '❌ ') + pmsg(m) + ' |');
                  for (const m of ws) lines.push('| ' + pn + ' | ⚠️ ' + pmsg(m) + ' (advisory) |');
                }
              }
            }
            lines.push('');
            lines.push('_[View details in Zaysa](' + detail + ')_ · _commit `${{ github.sha }}`_');
            let body = lines.join('\n');
            // GitHub rejects an issue comment body over 65536 chars — clamp with a pointer to logs.
            if (body.length > 64000) { body = body.slice(0, 64000) + '\n\n_…(comment truncated; full details in the run logs)_'; }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const all = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const prev = all.find(function (c) { return c.body && c.body.indexOf(MARKER) >= 0; });
            if (prev) { await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body }); }
            else { await github.rest.issues.createComment({ owner, repo, issue_number, body }); }

      - name: Infracost cost estimate (PR decoration)
        if: github.event_name == 'pull_request' && steps.plan.outputs.exit_code != '1'
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          INFRACOST_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFRACOST_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$INFRACOST_API_KEY" ]; then
            echo "::notice::INFRACOST_API_KEY secret not set — skipping cost decoration. Add it (free at infracost.io) to post Harness-style cost estimates on PRs."
            exit 0
          fi
          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh
          infracost breakdown --path ./infra/tfplan.json --format json --out-file /tmp/infracost.json
          infracost comment github --path /tmp/infracost.json --repo "$GITHUB_REPOSITORY" --pull-request "$INFRACOST_PR_NUMBER" --github-token "$INFRACOST_GH_TOKEN" --behavior update

      - name: Enforce OPA policy gate
        if: always() && github.event_name == 'pull_request' && steps.plan.outputs.exit_code != '1'
        run: |
          if [ -f /tmp/opa-hard-violation ]; then
            echo "::error::OPA policy gate failed — hard-enforcement violations were found (see the PR comment)."
            exit 1
          fi
          echo "OPA policy gate passed."

      - name: Upload plan artifact
        # Downloaded by Apply — guarantees reviewed plan = applied plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod-${{ github.run_id }}
          path: ./infra/tfplan.binary
          retention-days: 7

      - name: Fail if plan errored
        # Distinguish plan error (exit 1) from changes present (exit 2)
        if: steps.plan.outputs.exit_code == '1'
        run: exit 1

  # ── Apply (prod) — auto-apply, no gate ──
  apply_prod:
    name: Apply (prod)
    needs: plan_prod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      always() &&
      needs.plan_prod.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      ((github.event.inputs.environment || 'all') == 'all' || (github.event.inputs.environment || 'all') == 'prod') &&
      (github.event.inputs.action || 'apply') == 'apply' &&
      (needs.plan_prod.outputs.plan_exit_code == '2' || needs.plan_prod.outputs.plan_exit_code == '0')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Inject Terraform backend stub
        # Zaysa owns the remote-state choice in the pipeline wizard, but many user
        # Terraform repos do not commit a backend block. Without a backend "<type>" {}
        # stub, Terraform ignores -backend-config and silently falls back to local state.
        # The filename must NOT start with a dot — Terraform skips files beginning with
        # "." (treated as hidden/temp), so a dot-prefixed stub would never be loaded and
        # the backend block would be silently ignored.
        run: |
          cat > ./infra/zaysa_backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF

      - name: Provision container registry (Zaysa)
        # 1-click: auto-create the cloud-native registry so build+deploy have a target
        # without hand-written Terraform. Exposes output zaysa_image_repository_url.
        run: |
          cat > ./infra/zaysa_registry.tf <<'EOF'
          resource "aws_ecr_repository" "zaysa_app" {
            name                 = "zqa-cicd-public"
            image_tag_mutability = "MUTABLE"
            force_delete         = true
            image_scanning_configuration {
              scan_on_push = true
            }
          }
          output "zaysa_image_repository_url" {
            value = aws_ecr_repository.zaysa_app.repository_url
          }
          EOF

      - name: Terraform Init
        run: |
          terraform -chdir=./infra init \
            -backend-config="bucket=zqa-w111-tfstate-549243454374" \
            -backend-config="key=zqa-q4-studio/prod/terraform.tfstate" \
            -backend-config="region=us-west-2" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Select Terraform workspace (prod)
        run: |
          terraform -chdir=./infra workspace select -or-create prod

      - name: Download pinned plan artifact
        # This is the exact plan that was reviewed — no re-plan before apply
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod-${{ github.run_id }}
          path: ./infra

      - name: Terraform Apply
        run: terraform -chdir=./infra apply -auto-approve tfplan.binary

      - name: Capture Terraform deploy metadata
        # Bind downstream build/deploy steps to what this apply actually provisioned.
        run: |
          mkdir -p .zaysa-tfmeta
          terraform -chdir=./infra output -json > .zaysa-tfmeta/tf-outputs.json
          terraform -chdir=./infra show -json > .zaysa-tfmeta/tf-show.json

      - name: Upload Terraform deploy metadata
        uses: actions/upload-artifact@v4
        with:
          name: tfmeta-${{ github.run_id }}
          path: |
            .zaysa-tfmeta/tf-outputs.json
            .zaysa-tfmeta/tf-show.json
          retention-days: 7

  # ── Destroy (prod) — manual action=destroy only, gated by terraform-prod ──
  destroy_prod:
    name: Destroy (prod)
    needs: validate
    if: |
      (github.event.inputs.action || 'apply') == 'destroy' &&
      github.ref == 'refs/heads/main' &&
      ((github.event.inputs.environment || 'all') == 'all' || (github.event.inputs.environment || 'all') == 'prod')
    # Gate every tear-down behind the GitHub Environment (configure a reviewer to approve).
    environment: terraform-prod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Inject Terraform backend stub
        # Zaysa owns the remote-state choice in the pipeline wizard, but many user
        # Terraform repos do not commit a backend block. Without a backend "<type>" {}
        # stub, Terraform ignores -backend-config and silently falls back to local state.
        # The filename must NOT start with a dot — Terraform skips files beginning with
        # "." (treated as hidden/temp), so a dot-prefixed stub would never be loaded and
        # the backend block would be silently ignored.
        run: |
          cat > ./infra/zaysa_backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF

      - name: Provision container registry (Zaysa)
        # 1-click: auto-create the cloud-native registry so build+deploy have a target
        # without hand-written Terraform. Exposes output zaysa_image_repository_url.
        run: |
          cat > ./infra/zaysa_registry.tf <<'EOF'
          resource "aws_ecr_repository" "zaysa_app" {
            name                 = "zqa-cicd-public"
            image_tag_mutability = "MUTABLE"
            force_delete         = true
            image_scanning_configuration {
              scan_on_push = true
            }
          }
          output "zaysa_image_repository_url" {
            value = aws_ecr_repository.zaysa_app.repository_url
          }
          EOF

      - name: Terraform Init
        run: |
          terraform -chdir=./infra init \
            -backend-config="bucket=zqa-w111-tfstate-549243454374" \
            -backend-config="key=zqa-q4-studio/prod/terraform.tfstate" \
            -backend-config="region=us-west-2" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Select Terraform workspace (prod)
        run: |
          terraform -chdir=./infra workspace select -or-create prod

      - name: Terraform Destroy
        run: terraform -chdir=./infra destroy -auto-approve -no-color

  # ─────────────────────────────────────────────────────────────────────────────
  # Build & Push image — builds your Dockerfile and pushes ${{ env.IMAGE_REF }}
  # ─────────────────────────────────────────────────────────────────────────────
  build_app:
    name: Build & Push Image
    needs: [apply_prod]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Build & push only when a real apply happens — never on a pull_request (plan-only)
    # or a destroy/plan dispatch. Mirrors the Apply gate's branch + action conditions, so a
    # PR no longer pushes an image and "Destroy"/"Pull Request" no longer rebuilds the app.
    if: github.ref == 'refs/heads/main' && (github.event.inputs.action || 'apply') == 'apply'
    steps:
      - uses: actions/checkout@v4

      - name: Download Terraform deploy metadata
        uses: actions/download-artifact@v4
        with:
          name: tfmeta-${{ github.run_id }}
          path: .zaysa-tfmeta

      - name: Resolve image registry from Terraform output
        # Prefer the explicit Terraform output "zaysa_image_repository_url". For AWS/ECR we also
        # fall back to the provisioned repository resource when the output is absent,
        # which makes the flow feel more Harness-like on common ECR setups.
        run: |
          REPO=""
          if [ -z "$REPO" ]; then REPO=$(jq -r --arg k "zaysa_image_repository_url" '.[$k].value // empty' .zaysa-tfmeta/tf-outputs.json); fi
          if [ -z "$REPO" ]; then REPO=$(jq -r --arg k "ecr_repository_url" '.[$k].value // empty' .zaysa-tfmeta/tf-outputs.json); fi
          if [ -z "$REPO" ]; then REPO=$(jq -r --arg k "repository_url" '.[$k].value // empty' .zaysa-tfmeta/tf-outputs.json); fi
          if [ -z "$REPO" ] && [ -f .zaysa-tfmeta/tf-show.json ]; then
            REPO=$(jq -r 'first([
              .. | objects | select(.type? == "aws_ecr_repository") | .values.repository_url? | select(type == "string" and length > 0)
            ][]) // empty' .zaysa-tfmeta/tf-show.json)
          fi
          if [ -z "$REPO" ]; then echo "::error::Terraform output 'zaysa_image_repository_url' not found, and no registry repo could be derived from aws_ecr_repository state — add it to your Terraform (e.g. output \"zaysa_image_repository_url\" { value = <your registry repo URL> })."; exit 1; fi
          echo "IMAGE_REPO=$REPO" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$REPO:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        # Self-heals a torn-down / not-yet-created repo so the push never fails on a missing registry.
        run: |
          NAME="${IMAGE_REPO#*/}"
          aws ecr describe-repositories --repository-names "$NAME" --region us-west-2 >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$NAME" --region us-west-2 --image-scanning-configuration scanOnPush=false >/dev/null
          echo "ECR repository ready: $NAME"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # provenance/sbom OFF: buildx's default attestations push an OCI image INDEX (multi-manifest).
          # AWS Lambda's update-function-code REJECTS an index ("image manifest … not supported"), so a
          # Lambda deploy fails on an otherwise-good build. Attestations aren't consumed by any deploy
          # target here, so disabling them yields a single-manifest image that Lambda/ECS/EKS all accept.
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.IMAGE_REPO }}:latest

  # ─────────────────────────────────────────────────────────────────────────────
  # Notify — posts the final environment's result to Zaysa, win or lose
  # ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: Notify Zaysa
    needs: [validate, plan_prod, apply_prod, destroy_prod, build_app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post result to Zaysa
        # ZAYSA_WEBHOOK_URL and ZAYSA_API_KEY are provisioned automatically as
        # repository secrets when Zaysa creates this pipeline, so results show up
        # in the Deployments / Drift views. If you commit this file by hand instead,
        # set both secrets yourself (URL = your Zaysa pipeline runs endpoint).
        # continue-on-error keeps a reporting hiccup from failing the whole run: the
        # infrastructure change already happened, so failing here would report a red run
        # over a successful deploy. But it must never be SILENT either — this step used to
        # be a bare 'curl -s', which exits 0 even on a 401, so a rejected callback showed a
        # green tick while the run sat at "running" in Zaysa forever. We capture the status
        # code, echo the body, and raise a ::error:: annotation on anything non-2xx.
        continue-on-error: true
        env:
          ZAYSA_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          BODY=$(jq -n --arg event terraform_apply \
            --arg environment "prod" \
            --arg action "${{ github.event.inputs.action || 'apply' }}" \
            --arg status "${{ needs.apply_prod.result }}" \
            --arg plan_exit_code "${{ needs.plan_prod.outputs.plan_exit_code }}" \
            --arg workflow_run_id "${{ github.run_id }}" \
            --arg sha "${{ github.sha }}" \
            --arg branch "${{ github.ref_name }}" \
            --argjson jobs "$ZAYSA_NEEDS_JSON" \
            '{event:$event, environment:$environment, action:$action, status:$status, plan_exit_code:$plan_exit_code, workflow_run_id:$workflow_run_id, sha:$sha, branch:$branch, jobs:$jobs}')
          CODE=$(curl -sS -o /tmp/zaysa-notify.out -w '%{http_code}' \
            -X POST "${{ secrets.ZAYSA_WEBHOOK_URL_PIPE_99HILCP2MVVDEDYZ }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.ZAYSA_API_KEY_PIPE_99HILCP2MVVDEDYZ }}" \
            -d "$BODY") || CODE=000
          echo "Zaysa responded HTTP $CODE"
          cat /tmp/zaysa-notify.out 2>/dev/null || true
          echo
          case "$CODE" in
            2*) echo "Run status recorded in Zaysa." ;;
            *)  echo "::error title=Zaysa did not record this run::The result callback returned HTTP $CODE, so this run will still look in-progress in Zaysa even though the pipeline finished. Check the ZAYSA_WEBHOOK_URL / ZAYSA_API_KEY repository secrets."
                exit 1 ;;
          esac