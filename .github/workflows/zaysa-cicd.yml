# Generated by Zaysa — do not edit manually.
# Commit this file to .github/workflows/zaysa-terraform.yml in your repository.
#
# Pipeline: Validate → (per environment) Plan → Approval Gate → Apply → Notify
# Promotion order: production (approval)
# Safety:   Each environment uses its own Terraform workspace (isolated state)
#           and a plan artifact pinned per env + run id, so what is reviewed is
#           exactly what is applied. A later environment only applies after the
#           earlier one succeeds. Gated environments require a GitHub Environment
#           reviewer approval (terraform-<env>).

name: Zaysa Terraform CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/**', '**/Jenkinsfile*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy — pick one, or "all" to promote through every environment in order'
        type: choice
        required: true
        default: all
        options:
          - all
          - production
      action:
        description: 'apply = provision/update · plan = plan only, apply nothing (Pull Request strategy) · destroy = tear down the selected environment (gated)'
        type: choice
        required: true
        default: apply
        options:
          - apply
          - plan
          - destroy

# Never interrupt a running Apply — state corruption risk.
concurrency:
  # github.workflow is the workflow's NAME, which every generated Terraform pipeline shares —
  # so N pipelines on one branch all landed in ONE concurrency group and evicted each other.
  # (Seen live: a single commit left five unrelated pipelines showing "Cancelled" that nobody
  # ran and nobody stopped.) workflow_ref is the FILE path + ref, which is unique per pipeline.
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write       # Required for OIDC cloud authentication
  pull-requests: write  # Required to post plan summaries as PR comments

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Validate — fmt + validate + tflint (fast feedback, no credentials)
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Format Check
        # Fails the job if any .tf file is not formatted
        run: terraform -chdir=. fmt --check -recursive

      - name: Terraform Init (no backend)
        run: terraform -chdir=. init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=. validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint
        # Advisory — linting issues are warnings, not hard blockers
        continue-on-error: true
        run: |
          tflint --init
          tflint --chdir=.

  # ── Plan (production) — workspace "production", pinned artifact tfplan-production ──
  plan_production:
    name: Plan (production)
    needs: validate
    # Only plan this env when it is the selected target (or "all"/push), and not on destroy.
    if: ((github.event.inputs.environment || 'all') == 'all' || (github.event.inputs.environment || 'all') == 'production') && (github.event.inputs.action || 'apply') != 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/831341376080/locations/global/workloadIdentityPools/zaysa-pool/providers/github-actions
          service_account: zaysa-deploy@zqa-lab-gcp-1027b47f.iam.gserviceaccount.com

      - name: Terraform Init
        run: |
          terraform -chdir=. init -backend=false

      - name: Select Terraform workspace (production)
        run: |
          terraform -chdir=. workspace select -or-create production

      - name: Terraform Plan
        id: plan
        # exit 0 = no changes, exit 2 = changes present, exit 1 = error
        run: |
          terraform -chdir=. plan \
            -out=tfplan.binary \
            -detailed-exitcode \
            -no-color 2>&1 | tee /tmp/plan.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post plan summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8').slice(-60000);
            const exitCode = '${{ steps.plan.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ No changes'
              : exitCode === '2' ? '⚠️ Changes detected'
              : '❌ Plan failed';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## Terraform Plan (production) — ' + status,
                '',
                '<details><summary>Show plan output</summary>',
                '',
                '```',
                plan,
                '```',
                '</details>',
                '',
                '_Triggered by commit `${{ github.sha }}`_',
              ].join('\n'),
            });

      - name: Upload plan artifact
        # Downloaded by Apply — guarantees reviewed plan = applied plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-production-${{ github.run_id }}
          path: ./tfplan.binary
          retention-days: 7

      - name: Fail if plan errored
        # Distinguish plan error (exit 1) from changes present (exit 2)
        if: steps.plan.outputs.exit_code == '1'
        run: exit 1

  # ── Zaysa approval (production) — holds apply_production until a role-checked approver approves in Zaysa ──
  zaysa_approval_apply_production:
    name: Zaysa approval (production)
    needs: plan_production
    if: |
      always() &&
      needs.plan_production.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      ((github.event.inputs.environment || 'all') == 'all' || (github.event.inputs.environment || 'all') == 'production') &&
      (github.event.inputs.action || 'apply') == 'apply' &&
      (needs.plan_production.outputs.plan_exit_code == '2' || needs.plan_production.outputs.plan_exit_code == '0')
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Wait for approval in Zaysa
        env:
          ZAYSA_WEBHOOK_URL: ${{ secrets.ZAYSA_WEBHOOK_URL_PIPE_7YU2ZKYUMVRVSEMM }}
          ZAYSA_API_KEY: ${{ secrets.ZAYSA_API_KEY_PIPE_7YU2ZKYUMVRVSEMM }}
          ZAYSA_GATE: apply_production
          ZAYSA_ENVIRONMENT: production
          ZAYSA_WAIT_MINUTES: '330'
        run: |
          set -eu
          case "$ZAYSA_WEBHOOK_URL" in https://*|http://localhost*) ;; *) echo "::error title=Zaysa approval::The Zaysa callback secret is missing or not an https URL"; exit 1 ;; esac
          BASE="${ZAYSA_WEBHOOK_URL%/pipelines/*}"
          PIPELINE_ID="${ZAYSA_WEBHOOK_URL#*/pipelines/}"; PIPELINE_ID="${PIPELINE_ID%%/*}"
          AUDIENCE="$(printf '%s' "$ZAYSA_WEBHOOK_URL" | sed -E 's#^(https?://[^/]+).*#\1#')"
          DEADLINE=$(( $(date +%s) + ZAYSA_WAIT_MINUTES * 60 ))
          DELAY="${ZAYSA_POLL_START:-10}"
          FAILS=0
          while :; do
            # A fresh OIDC token for every poll: Zaysa accepts each token id once.
            TOKEN="$(curl -sS -G -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" --data-urlencode "audience=$AUDIENCE" "$ACTIONS_ID_TOKEN_REQUEST_URL" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')"
            if [ -z "$TOKEN" ]; then
              FAILS=$((FAILS + 1))
              if [ "$FAILS" -ge 8 ]; then echo "::error title=Zaysa approval::No OIDC token (the job needs permissions: id-token: write)"; exit 1; fi
              sleep "$DELAY"; continue
            fi
            echo "::add-mask::$TOKEN"
            RESP="$(mktemp)"
            CODE="$(curl -sS -o "$RESP" -w '%{http_code}' -X POST "$BASE/approvals/wait" \
              -H "Authorization: Bearer $TOKEN" -H "X-Zaysa-Callback-Token: $ZAYSA_API_KEY" -H 'Content-Type: application/json' \
              -d "{\"pipelineId\":\"$PIPELINE_ID\",\"gate\":\"$ZAYSA_GATE\",\"environment\":\"$ZAYSA_ENVIRONMENT\"}" || echo 000)"
            STATUS="$(sed -n 's/.*"status":"\([a-z_]*\)".*/\1/p' "$RESP" | head -n 1)"
            case "$CODE" in
              200)
                FAILS=0
                case "$STATUS" in
                  approved) echo "Approved in Zaysa - releasing $ZAYSA_GATE."; exit 0 ;;
                  rejected) echo "::error title=Rejected in Zaysa::The approval for $ZAYSA_ENVIRONMENT was rejected - $ZAYSA_GATE will not run."; exit 1 ;;
                  expired) echo "::error title=Approval expired::Nobody approved $ZAYSA_ENVIRONMENT in time - $ZAYSA_GATE will not run."; exit 1 ;;
                  pending) echo "Waiting for approval in Zaysa..." ;;
                  *) echo "::error title=Zaysa approval::Unexpected answer from Zaysa"; exit 1 ;;
                esac ;;
              400|401|403|404|409|410|422) echo "::error title=Zaysa refused this approval request::HTTP $CODE - the gated job will not run"; exit 1 ;;
              *) FAILS=$((FAILS + 1)); if [ "$FAILS" -ge 8 ]; then echo "::error title=Zaysa approval::Zaysa is unreachable (last HTTP $CODE)"; exit 1; fi ;;
            esac
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then echo "::error title=Approval timed out::Waited the maximum time for an approval in Zaysa"; exit 1; fi
            sleep "$DELAY"
            if [ "$DELAY" -lt 60 ]; then DELAY=$((DELAY * 2)); fi; if [ "$DELAY" -gt 60 ]; then DELAY=60; fi
          done

  # ── Apply (production) — gated by GitHub Environment terraform-production ──
  apply_production:
    name: Apply (production)
    needs: [plan_production, zaysa_approval_apply_production] # zaysa-approval:plain
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      always() &&
      needs.zaysa_approval_apply_production.result == 'success' &&
      needs.plan_production.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      ((github.event.inputs.environment || 'all') == 'all' || (github.event.inputs.environment || 'all') == 'production') &&
      (github.event.inputs.action || 'apply') == 'apply' &&
      (needs.plan_production.outputs.plan_exit_code == '2' || needs.plan_production.outputs.plan_exit_code == '0')
    # Required reviewers must approve in GitHub before this Apply proceeds
    environment: terraform-production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/831341376080/locations/global/workloadIdentityPools/zaysa-pool/providers/github-actions
          service_account: zaysa-deploy@zqa-lab-gcp-1027b47f.iam.gserviceaccount.com

      - name: Terraform Init
        run: |
          terraform -chdir=. init -backend=false

      - name: Select Terraform workspace (production)
        run: |
          terraform -chdir=. workspace select -or-create production

      - name: Download pinned plan artifact
        # This is the exact plan that was reviewed — no re-plan before apply
        uses: actions/download-artifact@v4
        with:
          name: tfplan-production-${{ github.run_id }}
          path: .

      - name: Terraform Apply
        run: terraform -chdir=. apply -auto-approve tfplan.binary

  # ── Zaysa approval (production) — holds destroy_production until a role-checked approver approves in Zaysa ──
  zaysa_approval_destroy_production:
    name: Zaysa approval (production)
    needs: validate
    if: |
      (github.event.inputs.action || 'apply') == 'destroy' &&
      github.ref == 'refs/heads/main' &&
      ((github.event.inputs.environment || 'all') == 'all' || (github.event.inputs.environment || 'all') == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Wait for approval in Zaysa
        env:
          ZAYSA_WEBHOOK_URL: ${{ secrets.ZAYSA_WEBHOOK_URL_PIPE_7YU2ZKYUMVRVSEMM }}
          ZAYSA_API_KEY: ${{ secrets.ZAYSA_API_KEY_PIPE_7YU2ZKYUMVRVSEMM }}
          ZAYSA_GATE: destroy_production
          ZAYSA_ENVIRONMENT: production
          ZAYSA_WAIT_MINUTES: '330'
        run: |
          set -eu
          case "$ZAYSA_WEBHOOK_URL" in https://*|http://localhost*) ;; *) echo "::error title=Zaysa approval::The Zaysa callback secret is missing or not an https URL"; exit 1 ;; esac
          BASE="${ZAYSA_WEBHOOK_URL%/pipelines/*}"
          PIPELINE_ID="${ZAYSA_WEBHOOK_URL#*/pipelines/}"; PIPELINE_ID="${PIPELINE_ID%%/*}"
          AUDIENCE="$(printf '%s' "$ZAYSA_WEBHOOK_URL" | sed -E 's#^(https?://[^/]+).*#\1#')"
          DEADLINE=$(( $(date +%s) + ZAYSA_WAIT_MINUTES * 60 ))
          DELAY="${ZAYSA_POLL_START:-10}"
          FAILS=0
          while :; do
            # A fresh OIDC token for every poll: Zaysa accepts each token id once.
            TOKEN="$(curl -sS -G -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" --data-urlencode "audience=$AUDIENCE" "$ACTIONS_ID_TOKEN_REQUEST_URL" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')"
            if [ -z "$TOKEN" ]; then
              FAILS=$((FAILS + 1))
              if [ "$FAILS" -ge 8 ]; then echo "::error title=Zaysa approval::No OIDC token (the job needs permissions: id-token: write)"; exit 1; fi
              sleep "$DELAY"; continue
            fi
            echo "::add-mask::$TOKEN"
            RESP="$(mktemp)"
            CODE="$(curl -sS -o "$RESP" -w '%{http_code}' -X POST "$BASE/approvals/wait" \
              -H "Authorization: Bearer $TOKEN" -H "X-Zaysa-Callback-Token: $ZAYSA_API_KEY" -H 'Content-Type: application/json' \
              -d "{\"pipelineId\":\"$PIPELINE_ID\",\"gate\":\"$ZAYSA_GATE\",\"environment\":\"$ZAYSA_ENVIRONMENT\"}" || echo 000)"
            STATUS="$(sed -n 's/.*"status":"\([a-z_]*\)".*/\1/p' "$RESP" | head -n 1)"
            case "$CODE" in
              200)
                FAILS=0
                case "$STATUS" in
                  approved) echo "Approved in Zaysa - releasing $ZAYSA_GATE."; exit 0 ;;
                  rejected) echo "::error title=Rejected in Zaysa::The approval for $ZAYSA_ENVIRONMENT was rejected - $ZAYSA_GATE will not run."; exit 1 ;;
                  expired) echo "::error title=Approval expired::Nobody approved $ZAYSA_ENVIRONMENT in time - $ZAYSA_GATE will not run."; exit 1 ;;
                  pending) echo "Waiting for approval in Zaysa..." ;;
                  *) echo "::error title=Zaysa approval::Unexpected answer from Zaysa"; exit 1 ;;
                esac ;;
              400|401|403|404|409|410|422) echo "::error title=Zaysa refused this approval request::HTTP $CODE - the gated job will not run"; exit 1 ;;
              *) FAILS=$((FAILS + 1)); if [ "$FAILS" -ge 8 ]; then echo "::error title=Zaysa approval::Zaysa is unreachable (last HTTP $CODE)"; exit 1; fi ;;
            esac
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then echo "::error title=Approval timed out::Waited the maximum time for an approval in Zaysa"; exit 1; fi
            sleep "$DELAY"
            if [ "$DELAY" -lt 60 ]; then DELAY=$((DELAY * 2)); fi; if [ "$DELAY" -gt 60 ]; then DELAY=60; fi
          done

  # ── Destroy (production) — manual action=destroy only, gated by terraform-production ──
  destroy_production:
    name: Destroy (production)
    needs: [validate, zaysa_approval_destroy_production] # zaysa-approval:plain
    if: |
      (github.event.inputs.action || 'apply') == 'destroy' &&
      github.ref == 'refs/heads/main' &&
      ((github.event.inputs.environment || 'all') == 'all' || (github.event.inputs.environment || 'all') == 'production')
    # Gate every tear-down behind the GitHub Environment (configure a reviewer to approve).
    environment: terraform-production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/831341376080/locations/global/workloadIdentityPools/zaysa-pool/providers/github-actions
          service_account: zaysa-deploy@zqa-lab-gcp-1027b47f.iam.gserviceaccount.com

      - name: Terraform Init
        run: |
          terraform -chdir=. init -backend=false

      - name: Select Terraform workspace (production)
        run: |
          terraform -chdir=. workspace select -or-create production

      - name: Terraform Destroy
        run: terraform -chdir=. destroy -auto-approve -no-color

  # ─────────────────────────────────────────────────────────────────────────────
  # Notify — posts the final environment's result to Zaysa, win or lose
  # ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: Notify Zaysa
    needs: [plan_production, apply_production, destroy_production]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post result to Zaysa
        # ZAYSA_WEBHOOK_URL and ZAYSA_API_KEY are provisioned automatically as
        # repository secrets when Zaysa creates this pipeline, so results show up
        # in the Deployments / Drift views. If you commit this file by hand instead,
        # set both secrets yourself (URL = your Zaysa pipeline runs endpoint).
        # continue-on-error keeps a reporting hiccup from failing the whole run: the
        # infrastructure change already happened, so failing here would report a red run
        # over a successful deploy. But it must never be SILENT either — this step used to
        # be a bare 'curl -s', which exits 0 even on a 401, so a rejected callback showed a
        # green tick while the run sat at "running" in Zaysa forever. We capture the status
        # code, echo the body, and raise a ::error:: annotation on anything non-2xx.
        continue-on-error: true
        run: |
          CODE=$(curl -sS -o /tmp/zaysa-notify.out -w '%{http_code}' \
            -X POST "${{ secrets.ZAYSA_WEBHOOK_URL_PIPE_7YU2ZKYUMVRVSEMM }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.ZAYSA_API_KEY_PIPE_7YU2ZKYUMVRVSEMM }}" \
            -d '{
              "event": "terraform_apply",
              "environment": "production",
              "status": "${{ needs.apply_production.result }}",
              "plan_exit_code": "${{ needs.plan_production.outputs.plan_exit_code }}",
              "workflow_run_id": "${{ github.run_id }}",
              "sha": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}"
            }') || CODE=000
          echo "Zaysa responded HTTP $CODE"
          cat /tmp/zaysa-notify.out 2>/dev/null || true
          echo
          case "$CODE" in
            2*) echo "Run status recorded in Zaysa." ;;
            *)  echo "::error title=Zaysa did not record this run::The result callback returned HTTP $CODE, so this run will still look in-progress in Zaysa even though the pipeline finished. Check the ZAYSA_WEBHOOK_URL / ZAYSA_API_KEY repository secrets."
                exit 1 ;;
          esac
